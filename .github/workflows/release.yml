name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  prepare-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or find the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if ! release_id=$(gh release view "$tag" --json databaseId --jq .databaseId); then
            gh release create "$tag" --title "$tag" --generate-notes --draft
            release_id=$(gh release view "$tag" --json databaseId --jq .databaseId)
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows"
            platform: "windows-latest"
            args: "--bundles nsis"
            rustTargets: ""
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: true
          - name: "macOS Apple Silicon"
            platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles dmg"
            rustTargets: "aarch64-apple-darwin"
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: false
          - name: "macOS Intel"
            platform: "macos-latest"
            args: "--target x86_64-apple-darwin --bundles dmg"
            rustTargets: "x86_64-apple-darwin"
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: false
          - name: "Linux"
            platform: "ubuntu-22.04"
            args: "--bundles appimage,deb"
            rustTargets: ""
            assetPattern: "[name]-[version]-linux-x86_64[ext]"
            uploadPlainBinary: false
            portableUpload: false
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Validate bundled SQLite on Windows
        if: matrix.platform == 'windows-latest'
        run: python scripts/test_windows_sqlite_config.py

      - name: Build and publish
        id: tauri
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          retryAttempts: 2
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.assetPattern }}
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
          uploadUpdaterJson: false

      - name: Upload Windows portable executable
        if: matrix.portableUpload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $metadata = cargo metadata --manifest-path "src-tauri/Cargo.toml" --no-deps --format-version 1 | ConvertFrom-Json
          $binaryTarget = $metadata.packages[0].targets |
            Where-Object { $_.kind -contains "bin" } |
            Select-Object -First 1

          if (-not $binaryTarget) {
            throw "Could not determine the Windows binary target from Cargo metadata."
          }

          $binaryPath = Join-Path "src-tauri/target/release" "$($binaryTarget.name).exe"
          if (-not (Test-Path -LiteralPath $binaryPath)) {
            throw "Portable executable was not found at $binaryPath."
          }

          $safeProductName = ($config.productName -replace '[^A-Za-z0-9._-]+', '-').Trim('-')
          $version = "${{ steps.tauri.outputs.appVersion }}"
          $assetName = "$safeProductName-$version-windows-x64-portable.exe"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName

          Copy-Item -LiteralPath $binaryPath -Destination $assetPath
          gh release upload "v$version" $assetPath --clobber

      - name: Upload Linux checksum manifest
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)
          deb=$(find src-tauri/target/release/bundle -type f -name '*.deb' -print -quit)
          if [ -z "$appimage" ] || [ -z "$deb" ]; then
            echo "Linux AppImage or DEB artifact is missing." >&2
            exit 1
          fi

          manifest="$RUNNER_TEMP/sql-judge-linux-x86_64.SHA256SUMS"
          printf '%s  sql-judge-${{ steps.tauri.outputs.appVersion }}-linux-x86_64.AppImage\n' "$(sha256sum "$appimage" | awk '{print $1}')" > "$manifest"
          printf '%s  sql-judge-${{ steps.tauri.outputs.appVersion }}-linux-x86_64.deb\n' "$(sha256sum "$deb" | awk '{print $1}')" >> "$manifest"
          gh release upload "v${{ steps.tauri.outputs.appVersion }}" "$manifest" --clobber

      - name: Release summary
        if: steps.tauri.outputs.releaseHtmlUrl != ''
        shell: bash
        run: |
          {
            echo "## Tauri Release"
            echo ""
            echo "- Platform: \`${{ matrix.name }}\`"
            echo "- Version: \`${{ steps.tauri.outputs.appVersion }}\`"
            echo "- Release: ${{ steps.tauri.outputs.releaseHtmlUrl }}"
            echo "- Artifacts: \`${{ steps.tauri.outputs.artifactPaths }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    needs: [prepare-release, publish-tauri]
    if: ${{ needs.prepare-release.result == 'success' && needs.publish-tauri.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release after all assets upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare-release.outputs.tag }}" --draft=false
