[package]
name = "judge-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
fallible-iterator = "0.2"
judge-core = { path = "../judge-core" }
native-tls = "0.2.14"
postgres = { version = "0.19.14", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
postgres-native-tls = "0.5.3"
serde_json = "1"
thiserror = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = "1.1"
