[package]
name = "problem-pack"
version = "0.1.0"
edition = "2024"

[dependencies]
app-storage = { path = "../app-storage" }
judge-core = { path = "../judge-core" }
judge-postgres = { path = "../judge-postgres" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
