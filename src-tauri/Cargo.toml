[package]
name = "tauri-native"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-storage = { path = "../crates/app-storage" }
environment-manager = { path = "../crates/environment-manager" }
judge-core = { path = "../crates/judge-core" }
judge-postgres = { path = "../crates/judge-postgres" }
judge-sqlserver = { path = "../crates/judge-sqlserver" }
keyring = "4.2.0"
log = "0.4"
thiserror = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
problem-pack = { version = "0.1.0", path = "../crates/problem-pack" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
